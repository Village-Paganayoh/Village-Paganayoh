<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Village Paganayoh</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
}

.hero{
    height:100vh;

    background-image:
    linear-gradient(
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.45)
    ),
    url('por_do_sol.png');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

.content{
    text-align:center;
    color:white;
    padding:20px;
}

.content h1{
    font-size:4rem;
    margin-bottom:20px;
}

.content p{
    font-size:1.4rem;
    margin-bottom:30px;
}

.btn{
    display:inline-block;

    background:#C6A76A;

    color:white;

    text-decoration:none;

    padding:15px 35px;

    border-radius:50px;

    font-weight:bold;
}

.btn:hover{
    background:#b28f4f;
}

@media(max-width:768px){

.content h1{
    font-size:2.5rem;
}

.content p{
    font-size:1.1rem;
}

}

</style>

</head>

<body>

<section class="hero">

<div class="content">

<h1>Village Paganayoh</h1>

<p>
Seu refúgio em Guarajuba, Bahia
</p>

<a
class="btn"
href="https://www.airbnb.com.br/rooms/30561403"
target="_blank">

Reservar no Airbnb

</a>
