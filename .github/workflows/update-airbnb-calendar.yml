name: Atualizar calendário Airbnb

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-calendario-airbnb
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar integração no site
        run: python3 scripts/patch_site_calendar.py

      - name: Atualizar disponibilidade
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: python3 scripts/update_airbnb_calendar.py

      - name: Publicar somente se houver mudança
        run: |
          if git diff --quiet -- index.html disponibilidade.json; then
            echo "Sem mudanças no calendário."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html disponibilidade.json
          git commit -m "Atualiza disponibilidade do Airbnb"
          git push origin HEAD:main
